# Variáveis comuns, vindas do .env da raiz. Use dentro de `environment` com `<<: *backend-env`
x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION:-us-east-1}

x-backend-env: &backend-env
  <<: *aws-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-dev}:${RABBITMQ_PASSWORD:-dev}@rabbitmq:5672/
  # Tracing distribuído: spans vão para o Jaeger por OTLP/HTTP.
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

# Base comum do S2 Personagens. Os valores de infraestrutura sobrescrevem
# services/characters/.env.example.
x-characters: &characters
  build:
    context: .
    dockerfile: services/characters/Dockerfile
  env_file: services/characters/.env.example
  environment:
    <<: *backend-env
    AWS_ENDPOINT_URL: ${CHARACTERS_AWS_ENDPOINT_URL:-http://ministack:4566}
    AWS_ACCESS_KEY_ID: ${CHARACTERS_AWS_ACCESS_KEY_ID:-characters-local}
    AWS_SECRET_ACCESS_KEY: ${CHARACTERS_AWS_SECRET_ACCESS_KEY:-characters-local-secret}
    S3_BUCKET: ${RPG_ASSETS_BUCKET:-rpg-assets}
    # Endereços vistos pelo NAVEGADOR (URLs pré-assinadas do S3 e origem do front).
    S3_PUBLIC_ENDPOINT_URL: http://localhost:${MINISTACK_PORT:-4566}
    CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    FAULT_CRASH_BEFORE_ACK: ${FAULT_CRASH_BEFORE_ACK:-off}
    CONSUMER_SIMULATED_DELAY_MS: ${CONSUMER_SIMULATED_DELAY_MS:-0}
    JAEGER_QUERY_URL: http://jaeger:16686
    # O mesmo segredo do S4, para validar o access token.
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-32-characters}
  networks:
    - rpg
    - db-characters

# Base comum do S1 Campanhas. Nomes de filas e tabelas vêm de services/campaigns/.env.example;
# os valores abaixo trocam os endereços do host pelos da rede Compose.
x-campaigns: &campaigns
  build:
    context: .
    dockerfile: services/campaigns/Dockerfile
  env_file: services/campaigns/.env.example
  environment:
    <<: *backend-env
    AWS_ENDPOINT_URL: ${CAMPAIGNS_AWS_ENDPOINT_URL:-http://ministack-campaigns:4566}
    AWS_ACCESS_KEY_ID: ${CAMPAIGNS_AWS_ACCESS_KEY_ID:-campaigns-local}
    AWS_SECRET_ACCESS_KEY: ${CAMPAIGNS_AWS_SECRET_ACCESS_KEY:-campaigns-local-secret}
    CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    CONTRACTS_DIR: /app/contracts
    # O mesmo segredo do S4, para validar o access token.
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-32-characters}
    # O S2, consultado quando o dono escolhe o modelo de ficha da campanha.
    CHARACTERS_URL: http://characters:8000
  networks:
    - rpg
    - db-campaigns

# Base comum do S4 Identidade e histórico. Também consome os resultados das aquisições.
x-identity: &identity
  build:
    context: .
    dockerfile: services/identity/Dockerfile
  env_file: services/identity/.env.example
  environment:
    <<: *backend-env
    AWS_ENDPOINT_URL: ${IDENTITY_AWS_ENDPOINT_URL:-http://ministack-identity:4566}
    AWS_ACCESS_KEY_ID: ${IDENTITY_AWS_ACCESS_KEY_ID:-identity-local}
    AWS_SECRET_ACCESS_KEY: ${IDENTITY_AWS_SECRET_ACCESS_KEY:-identity-local-secret}
    CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-32-characters}
    CONTRACTS_DIR: /app/contracts
    SERVICE_NAME: identity
  networks:
    - rpg
    - db-identity

# Base comum das telas de tabelas (dynamodb-admin): só sobem com `--profile db-admin`.
x-db-admin: &db-admin
  image: aaronshaf/dynamodb-admin:5.1.3
  profiles: ["db-admin"]
  restart: unless-stopped
  depends_on:
    terraform:
      condition: service_completed_successfully

x-db-admin-env: &db-admin-env
  AWS_REGION: ${AWS_REGION:-us-east-1}

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dev}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - rpg
    healthcheck:
      # A API de gerenciamento (porta 15672) abre depois do ping; o Terraform precisa dela.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_listener", "15672"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ministack:
    image: ministackorg/ministack:latest
    environment:
      AWS_ACCESS_KEY_ID: ${CHARACTERS_AWS_ACCESS_KEY_ID:-characters-local}
      AWS_SECRET_ACCESS_KEY: ${CHARACTERS_AWS_SECRET_ACCESS_KEY:-characters-local-secret}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      STATE_DIR: /data/state
      S3_PERSIST: "1"
      S3_DATA_DIR: /data/s3
    ports:
      - "127.0.0.1:${MINISTACK_PORT:-4566}:4566"
    volumes:
      - ministack-data:/data
    networks:
      - db-characters
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          aws --endpoint-url http://localhost:4566 --cli-connect-timeout 2 --cli-read-timeout 2 s3api list-buckets > /dev/null &&
          aws --endpoint-url http://localhost:4566 --cli-connect-timeout 2 --cli-read-timeout 2 dynamodb list-tables > /dev/null
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  ministack-campaigns:
    image: ministackorg/ministack:latest
    environment:
      AWS_ACCESS_KEY_ID: ${CAMPAIGNS_AWS_ACCESS_KEY_ID:-campaigns-local}
      AWS_SECRET_ACCESS_KEY: ${CAMPAIGNS_AWS_SECRET_ACCESS_KEY:-campaigns-local-secret}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      STATE_DIR: /data/state
    volumes:
      - ministack-campaigns-data:/data
    networks:
      - db-campaigns
    healthcheck:
      test: ["CMD-SHELL", "aws --endpoint-url http://localhost:4566 dynamodb list-tables > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  ministack-inventory:
    image: ministackorg/ministack:latest
    environment:
      AWS_ACCESS_KEY_ID: ${INVENTORY_AWS_ACCESS_KEY_ID:-inventory-local}
      AWS_SECRET_ACCESS_KEY: ${INVENTORY_AWS_SECRET_ACCESS_KEY:-inventory-local-secret}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      STATE_DIR: /data/state
    volumes:
      - ministack-inventory-data:/data
    networks:
      - db-inventory
    healthcheck:
      test: ["CMD-SHELL", "aws --endpoint-url http://localhost:4566 dynamodb list-tables > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  ministack-identity:
    image: ministackorg/ministack:latest
    environment:
      AWS_ACCESS_KEY_ID: ${IDENTITY_AWS_ACCESS_KEY_ID:-identity-local}
      AWS_SECRET_ACCESS_KEY: ${IDENTITY_AWS_SECRET_ACCESS_KEY:-identity-local-secret}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
      PERSIST_STATE: "1"
      STATE_DIR: /data/state
    volumes:
      - ministack-identity-data:/data
    networks:
      - db-identity
    healthcheck:
      test: ["CMD-SHELL", "aws --endpoint-url http://localhost:4566 dynamodb list-tables > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Telas para ver as tabelas de cada banco (só com `--profile db-admin`). Uma por MiniStack, ligada
  # só à rede de dados daquele serviço: cada tela enxerga um banco, como o próprio serviço.
  db-admin-campaigns:
    <<: *db-admin
    environment:
      <<: *db-admin-env
      DYNAMO_ENDPOINT: ${CAMPAIGNS_AWS_ENDPOINT_URL:-http://ministack-campaigns:4566}
      AWS_ACCESS_KEY_ID: ${CAMPAIGNS_AWS_ACCESS_KEY_ID:-campaigns-local}
      AWS_SECRET_ACCESS_KEY: ${CAMPAIGNS_AWS_SECRET_ACCESS_KEY:-campaigns-local-secret}
    ports:
      - "127.0.0.1:${DB_ADMIN_CAMPAIGNS_PORT:-8001}:8001"
    networks:
      - db-admin
      - db-campaigns

  db-admin-characters:
    <<: *db-admin
    environment:
      <<: *db-admin-env
      DYNAMO_ENDPOINT: ${CHARACTERS_AWS_ENDPOINT_URL:-http://ministack:4566}
      AWS_ACCESS_KEY_ID: ${CHARACTERS_AWS_ACCESS_KEY_ID:-characters-local}
      AWS_SECRET_ACCESS_KEY: ${CHARACTERS_AWS_SECRET_ACCESS_KEY:-characters-local-secret}
    ports:
      - "127.0.0.1:${DB_ADMIN_CHARACTERS_PORT:-8002}:8001"
    networks:
      - db-admin
      - db-characters

  db-admin-inventory:
    <<: *db-admin
    environment:
      <<: *db-admin-env
      DYNAMO_ENDPOINT: ${INVENTORY_AWS_ENDPOINT_URL:-http://ministack-inventory:4566}
      AWS_ACCESS_KEY_ID: ${INVENTORY_AWS_ACCESS_KEY_ID:-inventory-local}
      AWS_SECRET_ACCESS_KEY: ${INVENTORY_AWS_SECRET_ACCESS_KEY:-inventory-local-secret}
    ports:
      - "127.0.0.1:${DB_ADMIN_INVENTORY_PORT:-8003}:8001"
    networks:
      - db-admin
      - db-inventory

  db-admin-identity:
    <<: *db-admin
    environment:
      <<: *db-admin-env
      DYNAMO_ENDPOINT: ${IDENTITY_AWS_ENDPOINT_URL:-http://ministack-identity:4566}
      AWS_ACCESS_KEY_ID: ${IDENTITY_AWS_ACCESS_KEY_ID:-identity-local}
      AWS_SECRET_ACCESS_KEY: ${IDENTITY_AWS_SECRET_ACCESS_KEY:-identity-local-secret}
    ports:
      - "127.0.0.1:${DB_ADMIN_IDENTITY_PORT:-8004}:8001"
    networks:
      - db-admin
      - db-identity

  # Cria toda a infraestrutura e termina: tabelas DynamoDB e
  # bucket S3 no MiniStack, exchange/filas/ligações no RabbitMQ. Os serviços só sobem depois.
  # Rodar de novo não muda nada; um recurso apagado à mão é recriado. Guia: infra/terraform/README.md
  terraform:
    image: hashicorp/terraform:1.9
    restart: "no"
    depends_on:
      ministack:
        condition: service_healthy
      ministack-campaigns:
        condition: service_healthy
      ministack-inventory:
        condition: service_healthy
      ministack-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /state/.terraform
      TF_VAR_aws_region: ${AWS_REGION:-us-east-1}
      TF_VAR_campaigns_access_key_id: ${CAMPAIGNS_AWS_ACCESS_KEY_ID:-campaigns-local}
      TF_VAR_campaigns_secret_access_key: ${CAMPAIGNS_AWS_SECRET_ACCESS_KEY:-campaigns-local-secret}
      TF_VAR_characters_access_key_id: ${CHARACTERS_AWS_ACCESS_KEY_ID:-characters-local}
      TF_VAR_characters_secret_access_key: ${CHARACTERS_AWS_SECRET_ACCESS_KEY:-characters-local-secret}
      TF_VAR_inventory_access_key_id: ${INVENTORY_AWS_ACCESS_KEY_ID:-inventory-local}
      TF_VAR_inventory_secret_access_key: ${INVENTORY_AWS_SECRET_ACCESS_KEY:-inventory-local-secret}
      TF_VAR_identity_access_key_id: ${IDENTITY_AWS_ACCESS_KEY_ID:-identity-local}
      TF_VAR_identity_secret_access_key: ${IDENTITY_AWS_SECRET_ACCESS_KEY:-identity-local-secret}
      TF_VAR_campaigns_endpoint_url: ${CAMPAIGNS_AWS_ENDPOINT_URL:-http://ministack-campaigns:4566}
      TF_VAR_characters_endpoint_url: ${CHARACTERS_AWS_ENDPOINT_URL:-http://ministack:4566}
      TF_VAR_inventory_endpoint_url: ${INVENTORY_AWS_ENDPOINT_URL:-http://ministack-inventory:4566}
      TF_VAR_identity_endpoint_url: ${IDENTITY_AWS_ENDPOINT_URL:-http://ministack-identity:4566}
      TF_VAR_assets_bucket: ${RPG_ASSETS_BUCKET:-rpg-assets}
      TF_VAR_cors_allowed_origin: http://localhost:${FRONTEND_PORT:-5173}
      TF_VAR_rabbitmq_management_url: http://rabbitmq:15672
      TF_VAR_rabbitmq_user: ${RABBITMQ_USER:-dev}
      TF_VAR_rabbitmq_password: ${RABBITMQ_PASSWORD:-dev}
    working_dir: /work/infra/terraform
    entrypoint:
      - /bin/sh
      - -c
      - terraform init -input=false -backend-config=path=/state/terraform.tfstate && exec terraform "$$@"
      - --
    command: ["apply", "-input=false", "-auto-approve"]
    volumes:
      - .:/work:ro
      - ./infra/terraform:/work/infra/terraform
      - terraform-state:/state
    networks:
      - rpg
      - db-campaigns
      - db-characters
      - db-inventory
      - db-identity

  characters:
    <<: *characters
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHARACTERS_PORT:-8000}:8000"
    depends_on:
      terraform:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  # Réplicas do S2 que só consomem as filas (sem porta no host, por isso podem escalar).
  # Manual: docker compose up -d --scale characters-worker=3   |   automático: perfil "autoscale".
  characters-worker:
    <<: *characters
    restart: unless-stopped
    depends_on:
      terraform:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  # Bônus (tracing distribuído): recebe os spans de todos os serviços (OTLP) e mostra os traces.
  #   UI: http://localhost:16686   |   serviços na rede Compose: OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    networks:
      - rpg

  # Bônus (autoescala): ajusta o número de réplicas de characters-worker pelo tamanho da fila.
  #   docker compose --profile autoscale up -d autoscaler
  autoscaler: &autoscaler
    image: docker:27-cli
    profiles: ["autoscale"]
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment: &autoscaler-env
      RABBITMQ_API_URL: http://rabbitmq:15672
      RABBITMQ_USER: ${RABBITMQ_USER:-dev}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
      AUTOSCALE_QUEUE: ${AUTOSCALE_QUEUE:-characters.validation-requested.v1}
      AUTOSCALE_SERVICE: characters-worker
      AUTOSCALE_MIN_REPLICAS: ${AUTOSCALE_MIN_REPLICAS:-1}
      AUTOSCALE_MAX_REPLICAS: ${AUTOSCALE_MAX_REPLICAS:-4}
      AUTOSCALE_MESSAGES_PER_REPLICA: ${AUTOSCALE_MESSAGES_PER_REPLICA:-100}
      AUTOSCALE_INTERVAL_SECONDS: ${AUTOSCALE_INTERVAL_SECONDS:-5}
      AUTOSCALE_SCALE_DOWN_AFTER: ${AUTOSCALE_SCALE_DOWN_AFTER:-3}
    working_dir: /work
    entrypoint: ["/bin/sh", "/work/infra/autoscaler/autoscale.sh"]
    volumes:
      - .:/work:ro
      # O autoscaler fala com o Docker do host para criar e remover réplicas.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - rpg

  autoscaler-campaigns:
    <<: *autoscaler
    environment:
      <<: *autoscaler-env
      AUTOSCALE_QUEUE: campaigns.activity.v1
      AUTOSCALE_SERVICE: campaigns-worker

  autoscaler-inventory:
    <<: *autoscaler
    environment:
      <<: *autoscaler-env
      AUTOSCALE_QUEUE: inventory.saga-replies.v1
      AUTOSCALE_SERVICE: inventory-worker

  autoscaler-identity:
    <<: *autoscaler
    environment:
      <<: *autoscaler-env
      AUTOSCALE_QUEUE: actions.validation-requested.v1
      AUTOSCALE_SERVICE: identity-validator

  campaigns:
    <<: *campaigns
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CAMPAIGNS_PORT:-3001}:3001"
    depends_on:
      terraform:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  # Réplicas do S1 que dividem a fila campaigns.activity.v1 com o `campaigns` (consumidores
  # concorrentes). Sem porta no host, por isso podem escalar:
  #   docker compose up -d --scale campaigns-worker=3
  campaigns-worker:
    <<: *campaigns
    restart: unless-stopped
    depends_on:
      terraform:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  # S3 Inventário. Nomes de filas e o prefixo das tabelas vêm de services/inventory/.env.example;
  # aqui só muda o que aponta para dentro da rede do Compose.
  inventory: &inventory
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    restart: unless-stopped
    env_file: services/inventory/.env.example
    environment: &inventory-env
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${INVENTORY_AWS_ACCESS_KEY_ID:-inventory-local}
      AWS_SECRET_ACCESS_KEY: ${INVENTORY_AWS_SECRET_ACCESS_KEY:-inventory-local-secret}
      DYNAMODB_ENDPOINT: ${INVENTORY_AWS_ENDPOINT_URL:-http://ministack-inventory:4566}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-dev}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dev}
      SAGA_TIMEOUT_SECONDS: ${SAGA_TIMEOUT_SECONDS:-60}
      VALIDATION_EVENT_VERSION: ${VALIDATION_EVENT_VERSION:-0}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-this-jwt-secret-32-characters}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
      # Tracing: lidas pelo agente Java do OpenTelemetry (só traces; métricas e logs ficam de fora).
      OTEL_SERVICE_NAME: inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      # Sem um trace a cada execução do ExpirationWorker e do OutboxPublisher (a cada 2 s) no Jaeger.
      OTEL_INSTRUMENTATION_SPRING_SCHEDULING_ENABLED: "false"
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      rabbitmq:
        condition: service_healthy
      terraform:
        condition: service_completed_successfully
      characters:
        condition: service_started
      campaigns:
        condition: service_started
      jaeger:
        condition: service_started
    networks:
      - rpg
      - db-inventory

  inventory-worker:
    <<: *inventory
    profiles: ["autoscale"]
    ports: []
    environment:
      <<: *inventory-env
      OTEL_SERVICE_NAME: inventory-worker
      INVENTORY_RUN_SCHEDULERS: "false"

  identity:
    <<: *identity
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-3002}:3002"
    depends_on:
      terraform:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Dependência externa instável simulada da Saga de compra (consome actions.validation-requested.v1).
  # Parte do S4 (mesmo código e imagem), em contêiner próprio: se ficar lento ou cair, o login continua no ar.
  identity-validator:
    <<: *identity
    command: ["node", "dist/validator.js"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      AWS_ENDPOINT_URL: ${IDENTITY_AWS_ENDPOINT_URL:-http://ministack-identity:4566}
      AWS_ACCESS_KEY_ID: ${IDENTITY_AWS_ACCESS_KEY_ID:-identity-local}
      AWS_SECRET_ACCESS_KEY: ${IDENTITY_AWS_SECRET_ACCESS_KEY:-identity-local-secret}
      CONTRACTS_DIR: /app/contracts
      PORT: 3003
      # Nome próprio no Jaeger, separado do S4 (mesma imagem).
      SERVICE_NAME: identity-validator
      VALIDATION_MIN_DELAY_MS: ${VALIDATION_MIN_DELAY_MS:-100}
      VALIDATION_MAX_DELAY_MS: ${VALIDATION_MAX_DELAY_MS:-500}
      VALIDATION_FAILURE_RATE: ${VALIDATION_FAILURE_RATE:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      terraform:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - rpg
      - db-identity

  frontend:
    build:
      context: apps/frontend
      args:
        VITE_CHARACTERS_URL: http://localhost:${CHARACTERS_PORT:-8000}
        VITE_INVENTORY_URL: http://localhost:${INVENTORY_PORT:-8080}
        VITE_CAMPAIGNS_URL: http://localhost:${CAMPAIGNS_PORT:-3001}
        VITE_IDENTITY_URL: http://localhost:${IDENTITY_PORT:-3002}
        VITE_ACTIONS_URL: http://localhost:${IDENTITY_PORT:-3002}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks:
      - rpg

networks:
  rpg:
    driver: bridge
  db-campaigns:
    internal: true
  db-characters:
    driver: bridge
  db-inventory:
    internal: true
  db-identity:
    internal: true
  # Só para publicar as portas das telas de tabelas no host; os MiniStacks não entram nela.
  db-admin:
    driver: bridge

volumes:
  rabbitmq-data:
  ministack-data:
  ministack-campaigns-data:
  ministack-inventory-data:
  ministack-identity-data:
  terraform-state:
