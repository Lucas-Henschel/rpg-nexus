server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: simple
    listener:
      simple:
        acknowledge-mode: manual
        missing-queues-fatal: false
        retry:
          enabled: false
inventory:
  table-prefix: ${INVENTORY_TABLE_PREFIX:inventory_}
  exchange: ${RABBITMQ_EXCHANGE:rpg.events}
  queue: ${RABBITMQ_QUEUE:inventory.saga-replies.v1}
  retry-queue: ${RABBITMQ_RETRY_QUEUE:inventory.saga-replies.v1.retry}
  members-queue: ${RABBITMQ_MEMBERS_QUEUE:inventory.campaign-members.v1}
  members-retry-queue: ${RABBITMQ_MEMBERS_RETRY_QUEUE:inventory.campaign-members.v1.retry}
  retry-base-delay-ms: ${RETRY_BASE_DELAY_MS:1000}
  saga-timeout-seconds: ${SAGA_TIMEOUT_SECONDS:60}
  max-retries: ${MAX_RETRIES:3}
